# LAWOSS self-hosted stack: Caddy in front (ports 80 and 443 only, automatic certificates per
# host), the authorization server and the MCP hub behind it on an internal network.
# Lives in /opt/lawoss with .env (mode 0600) and the Caddyfile rendered from Caddyfile.template;
# both are written by the setup CLI. No service mounts the Docker socket.
name: lawoss

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  proxy:
    <<: *hardening
    image: ${LAWOSS_PROXY_IMAGE:?LAWOSS_PROXY_IMAGE is required}
    # Binding 80 and 443 is the only capability any service gets.
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - type: volume
        source: caddy-data
        target: /data
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /config
      - /tmp
    mem_limit: 256m
    pids_limit: 256
    networks:
      edge: {}
      internal:
        # The hub introspects at the issuer's public origin; this alias keeps that request on the
        # host (no hairpin NAT needed). Caddy forwards it to auth with the Host unchanged.
        aliases:
          - ${AUTH_PUBLIC_HOST:?AUTH_PUBLIC_HOST is required}
    depends_on:
      - auth
      - hub

  auth:
    <<: *hardening
    image: ${LAWOSS_AUTH_IMAGE:?LAWOSS_AUTH_IMAGE is required}
    environment:
      AUTH_CONFIG_JSON: ${AUTH_CONFIG_JSON:?AUTH_CONFIG_JSON is required}
      PORT: "3000"
    volumes:
      - type: volume
        source: auth-data
        target: /data
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 128
    networks:
      - internal
    # The server answers only its public Host and, behind the proxy, only X-Forwarded-Proto https.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,path:'/health',timeout:4000,headers:{host:'${AUTH_PUBLIC_HOST:?AUTH_PUBLIC_HOST is required}','x-forwarded-proto':'https'}},r=>process.exit(r.statusCode===200?0:1)).on('timeout',()=>process.exit(1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  hub:
    <<: *hardening
    image: ${LAWOSS_HUB_IMAGE:?LAWOSS_HUB_IMAGE is required}
    # Reaps runtime processes and forwards stop signals to the hub.
    init: true
    environment:
      HUB_CONFIG_JSON: ${HUB_CONFIG_JSON:?HUB_CONFIG_JSON is required}
      PORT: "3000"
      # Provider keys; each runtime receives only the names its manifest entry lists.
      CRZ_MISTRAL_OCR: ${CRZ_MISTRAL_OCR:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-}
      EURLEX_WS_DAILY_LIMIT: ${EURLEX_WS_DAILY_LIMIT:-}
      EURLEX_WS_USERNAME: ${EURLEX_WS_USERNAME:-}
      EURLEX_WS_PASSWORD: ${EURLEX_WS_PASSWORD:-}
      FS_API_KEY: ${FS_API_KEY:-}
      USTAVNY_CLIENT_ID: ${USTAVNY_CLIENT_ID:-}
      USTAVNY_CLIENT_SECRET: ${USTAVNY_CLIENT_SECRET:-}
    volumes:
      - type: volume
        source: hub-data
        target: /data
    tmpfs:
      - /tmp
    # Default caps: 40 runtime processes at roughly 120 MB each, every Node process with its threads.
    mem_limit: 6g
    pids_limit: 2048
    networks:
      - internal
      # Runtimes call the public portals.
      - egress
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,path:'/health',timeout:4000},r=>process.exit(r.statusCode===200?0:1)).on('timeout',()=>process.exit(1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # auth and hub listen only here; auth has no other network and so no route out.
  internal:
    internal: true
  # Published ports and certificate issuance.
  edge: {}
  # Outbound access for the hub's runtimes.
  egress: {}

volumes:
  auth-data: {}
  hub-data: {}
  caddy-data: {}
