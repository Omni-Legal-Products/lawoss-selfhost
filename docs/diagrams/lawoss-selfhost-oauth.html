<h1>Prihlásenie OAuth do služby</h1>
<p class="subtitle">Každá služba je samostatný OAuth zdroj na vlastnom hoste. Auth pri dynamickej registrácii prijme iba loopback callback alebo callback výslovne zapísaný v konfigurácii.</p>
