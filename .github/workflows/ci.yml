name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: auth/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Resource-server adapter
        run: |
          npx tsc -p resource-server/tsconfig.json
          node --test resource-server/skallars-auth.test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - name: Export manifest
        run: |
          sed 's#  #  ./#' EXPORT_MANIFEST.sha256 | sha256sum --check --quiet
      - run: docker build -t lawoss-auth:test .
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Omni-Legal-Products/lawoss-marketplace
          path: catalog
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Install and test
        working-directory: hub
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Fetch verified runtimes
        run: |
          COMMIT=$(node -p "require('./hub/services.json').catalogCommit")
          node hub/scripts/fetch-runtimes.mjs --catalog catalog --catalog-commit "$COMMIT" --out "$RUNNER_TEMP/runtimes"
      # Mirrors the image build's one-time warm-up. This step and the cross-check below may use npm and
      # the network; only the pooled-runtime step runs without npm and from the read-only cache.
      - name: Warm the shared runtime cache
        run: |
          LAWOSS_CACHE_DIR="$RUNNER_TEMP/lawoss-cache" LAWOSS_STATE_DIR="$RUNNER_TEMP/warm-state" \
            node "$RUNNER_TEMP/runtimes/crz/scripts/run.mjs" tools > /dev/null
      - name: Cross-check runtime tools
        working-directory: hub
        run: |
          LAWOSS_RUNTIMES_DIR="$RUNNER_TEMP/runtimes" LAWOSS_CACHE_DIR="$RUNNER_TEMP/lawoss-cache" node --test test/manifest.test.mjs
      - name: Pooled runtime starts without npm or network from the read-only cache
        working-directory: hub
        run: |
          chmod -R a-w "$RUNNER_TEMP/lawoss-cache"
          trap 'chmod -R u+w "$RUNNER_TEMP/lawoss-cache"' EXIT
          LAWOSS_RUNTIMES_DIR="$RUNNER_TEMP/runtimes" LAWOSS_CACHE_DIR="$RUNNER_TEMP/lawoss-cache" node --test test/pool.test.mjs
      # Fetches the catalog at services.json catalogCommit itself and warms every runtime; not pushed.
      - name: Build the hub image
        run: docker build -t lawoss-hub:test -f hub/Dockerfile hub
      - name: Hub image runs offline from its read-only cache, without npm
        run: |
          docker run --rm -i --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp --entrypoint sh lawoss-hub:test -s < hub/test/image-smoke.sh
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compose and Caddyfile checks
        run: python3 -m unittest -v deploy/test/compose.test.py
      - name: Compose file is valid with the example environment
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env.example config -q
  agents-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cmp AGENTS.md CLAUDE.md
